id: nepal-climate-service-demo
name: Nepal Climate Service (Demo)

extent:
  name: Nepal
  bbox: [80.05, 26.35, 88.20, 30.45]
  country_code: NPL

data_dir: ./data

# Public demo: browsable but not modifiable. Refuses ingestion, sync, stored process
# graphs, batch jobs and the /manage console; keeps the catalogue, the data endpoints,
# the map viewer and synchronous `POST /result` execution.
#
# Ingestion is an operator task run on the host — see "Ingesting data" in README.md.
#
# REQUIRES a version of open-climate-service that implements read-only mode. On a build
# without it this key is silently ignored and the instance is fully writable. See the
# pinning note in pyproject.toml.
read_only: true

# One instance plugin: the CLMS GPP dekadal dataset (plugins/datasets/clms_gpp.py). It is here
# because it exercises two things the built-in datasets do not — a dekadal (irregular) cadence
# and a credentialed S3 source. Everything else this instance serves is built in.
plugins_dir: ./plugins
