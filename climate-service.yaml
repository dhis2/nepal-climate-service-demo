id: nepal-climate-service-demo
name: Nepal Climate Service (Demo)

extent:
  name: Nepal
  bbox: [80.05, 26.35, 88.20, 30.45]
  country_code: NPL

data_dir: ./data

# NOT IN EFFECT ON THE CURRENT PIN. This repo tracks open-climate-service main, which does
# not implement read-only mode yet — PR #329 is still open. Config there is read as a plain
# dict, so this key is silently ignored and the instance serves every write endpoint:
# ingestion, sync, stored process graphs, batch jobs and the /manage console. Do not expose
# it publicly as it stands — see "Read-only" in README.md and the pinning note in
# pyproject.toml.
#
# Kept rather than deleted, on purpose: it records the intended posture, and it starts
# taking effect on its own the moment #329 lands, with no edit needed here. Once it does,
# the instance becomes browsable but not modifiable — refusing the endpoints above while
# keeping the catalogue, the data endpoints, the map viewer and synchronous `POST /result`.
#
# Ingestion is an operator task run on the host — see "Ingesting data" in README.md.
read_only: true

# No plugins_dir: this instance deliberately runs the built-in datasets, processes and
# workflows only, so it demonstrates stock Open Climate Service behaviour.
