id: nepal-climate-service-demo
name: Nepal Climate Service (Demo)

extent:
  name: Nepal
  bbox: [80.05, 26.35, 88.20, 30.45]
  country_code: NPL

data_dir: ./data

# Not in effect on the current pin: open-climate-service main does not implement read-only
# mode yet (PR #329), so this key is ignored and the instance is writable. Takes effect
# when #329 lands. See "Read-only" in README.md.
read_only: true

# No plugins_dir: this instance deliberately runs the built-in datasets, processes and
# workflows only, so it demonstrates stock Open Climate Service behaviour.
