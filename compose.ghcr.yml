# Overlay for compose.yml: run the image upstream publishes instead of building this
# repo's pin. Layered on top of the base, never used alone --
#   make docker-run COMPOSE=compose.ghcr.yml
# which expands to `docker compose -f compose.yml -f compose.ghcr.yml`. Everything else,
# including ports, config mount, data mount and healthcheck, comes from compose.yml.
services:
  api:
    build: !reset null
    image: ghcr.io/dhis2/open-climate-service:${OCS_TAG:-main}
    pull_policy: always
    platform: linux/amd64
