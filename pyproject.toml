[project]
name = "nepal-climate-service-demo"
version = "0.1.0"
requires-python = ">=3.12"
description = "Public demo instance of Open Climate Service, configured to the Nepal extent"
dependencies = [
    # Tracks git main rather than a PyPI release: upstream has published no release
    # containing read-only mode, and `read_only: true` (CLIM-861) is what keeps this
    # public instance from serving every write endpoint. CLIM-848 wants a released pin.
    #
    # TODO: re-pin to `open-climate-service[server]==<first release with read-only mode>`
    # and drop the [tool.uv.sources] block below.
    "open-climate-service[server]",
]

# No instance-specific dependencies: this demo runs the built-in datasets only, and their
# runtime deps (ecmwf-datastores-client for ERA5-Land, netcdf4) are part of the [server]
# extra. Anything added here would mean a custom plugin had crept in.

[tool.uv]
package = false
# Required for uv to resolve the [server] extra: these relax upstream transitive pins —
# openeo-pg-parser-networkx pins geojson-pydantic<2 (we need >=2.1.0) and
# openeo-processes-dask pins an older zarr (Open-EO/openeo-processes-dask#376).
# Keep in step with the same block in the open-climate-service repo.
override-dependencies = [
    "geojson-pydantic>=2.1.0",
    "zarr>=3.1.6",
    "pyarrow>=19.0",
    "xarray>=2025.12.0",
    "numpy>=2.2",
    "dask>=2024.1.0",
    "dask-geopandas>=0.4",
    "geopandas>=1.1",
    "xvec>=0.3",
    "rioxarray>=0.17",
    "pystac>=1.10",
]

[tool.uv.sources]
# main, not the old feat/read-only-mode branch: PR #329 merged on 2026-08-11 and that
# branch has since been deleted upstream, so the previous pin no longer resolves at all.
# main therefore has read-only mode, which is the only reason tracking a branch rather
# than a release is acceptable here — `read_only: true` is an ordinary config key, so a
# build without the feature ignores it in silence and serves every write endpoint.
# `make verify` checks the running instance actually refuses writes.
open-climate-service = { git = "https://github.com/dhis2/open-climate-service.git", branch = "main" }
