[project]
name = "nepal-climate-service-demo"
version = "0.1.0"
requires-python = ">=3.12"
description = "Public demo instance of Open Climate Service, configured to the Nepal extent"
# Only what the instance plugins need. open-climate-service itself comes from the base
# image the Dockerfile builds on, and so does everything it depends on. boto3 is for
# clms_gpp.py's AWSSession.
dependencies = [
    "boto3>=1.34",
]

[dependency-groups]
dev = ["pytest>=8", "pyyaml"]

[tool.pytest.ini_options]
# plugins_dir is added to sys.path at startup; do the same so the modules import.
pythonpath = ["plugins"]

[tool.uv]
package = false
