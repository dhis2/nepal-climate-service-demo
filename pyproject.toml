[project]
name = "nepal-climate-service-demo"
version = "0.1.0"
# Pinned to 3.12, matching upstream's own .python-version, rather than upstream's looser
# `>=3.12`. This is a deployment, not a library: it should run the interpreter upstream
# builds and tests against, not whatever is newest. Without the upper bound uv resolved a
# 3.13 environment here, which also left the PROJ_DATA hint in .env.example pointing at a
# site-packages path that did not exist. The matching .python-version selects it.
requires-python = ">=3.12,<3.13"
description = "Public demo instance of Open Climate Service, configured to the Nepal extent"
dependencies = [
    # Tracks git main rather than a PyPI release because there is no release to track:
    # open-climate-service has published no tags and no releases at all. CLIM-848 asks for
    # a released pin so demos don't break when main moves; until one exists, main is the
    # only option, and `make upgrade` followed by `make verify` is what keeps it honest.
    #
    # TODO: re-pin to `open-climate-service[server]==<first release>` and drop the
    # [tool.uv.sources] block below, once upstream cuts one.
    "open-climate-service[server]",
]

# No instance-specific dependencies: this demo runs the built-in datasets only, and their
# runtime deps (ecmwf-datastores-client for ERA5-Land, netcdf4) are part of the [server]
# extra. Anything added here would mean a custom plugin had crept in.

[tool.uv]
package = false
# Required for uv to resolve the [server] extra: these relax upstream transitive pins —
# openeo-pg-parser-networkx pins geojson-pydantic<2 (we need >=2.1.0) and
# openeo-processes-dask pins an older zarr (Open-EO/openeo-processes-dask#376).
# Keep in step with the same block in the open-climate-service repo.
override-dependencies = [
    "geojson-pydantic>=2.1.0",
    "zarr>=3.1.6",
    "pyarrow>=19.0",
    "xarray>=2025.12.0",
    "numpy>=2.2",
    "dask>=2024.1.0",
    "dask-geopandas>=0.4",
    "geopandas>=1.1",
    "xvec>=0.3",
    "rioxarray>=0.17",
    "pystac>=1.10",
]

[tool.uv.sources]
# Main, deliberately — not the read-only branch. Read-only mode is still unmerged
# (PR #329), so this pin does NOT enforce it: `read_only: true` in climate-service.yaml is
# an unrecognised key on main, and config is read as a plain dict, so it is silently
# ignored and every write endpoint is served. Verified by observation, not assumed — on
# main `POST /ingestions` returns 422 rather than 403, `/info` has no `read_only` field,
# and the `/manage` console is reachable.
#
# That consequence is deliberate and documented: see "Read-only" in README.md. Do not
# expose this instance publicly on this pin. When #329 lands, `read_only: true` starts
# taking effect on its own and `make verify` starts reporting it — nothing to change here.
open-climate-service = { git = "https://github.com/dhis2/open-climate-service.git", branch = "main" }
