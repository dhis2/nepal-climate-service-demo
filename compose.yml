services:
  api:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8003}:8003"
    environment:
      PORT: 8003
      CLIMATE_SERVICE_CONFIG: ${CLIMATE_SERVICE_CONFIG:-/app/climate-service.yaml}
      CLIMATE_SERVICE_BASE_URL: ${CLIMATE_SERVICE_BASE_URL:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
