services:
  api:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${PORT:-8003}:8003"
    environment:
      CLIMATE_SERVICE_BASE_URL: ${CLIMATE_SERVICE_BASE_URL:-}
    volumes:
      - ./climate-service.yaml:/app/climate-service.yaml:ro
      - ./plugins:/app/plugins:ro
      - ./data:/app/data
