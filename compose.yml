services:
  api:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${PORT:-8003}:8003"
    env_file:
      - path: .env
        required: false
    environment:
      CLIMATE_SERVICE_BASE_URL: ${CLIMATE_SERVICE_BASE_URL:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # Bind, not a named volume: data has to be reachable from the host so it can be
      # copied in from elsewhere and served as-is. See "Where the data lives" in README.md.
      - ${DATA_DIR:-./data}:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
